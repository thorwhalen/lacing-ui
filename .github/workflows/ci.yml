name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (biome)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The Zod in src/types/generated/ is codegened from JSON Schema artifacts
      # committed in the lacing Python repo, at the version pinned in
      # .lacing-version. Both sides are committed; this gate fails when the
      # committed Zod has drifted from the schemas at that pinned version —
      # i.e. when someone bumps .lacing-version (or lacing ships new schemas)
      # without re-running `npm run codegen`.
      - name: Read pinned lacing version
        id: lacing-version
        run: echo "version=$(cat .lacing-version)" >> "$GITHUB_OUTPUT"

      - name: Check out lacing schema artifacts
        uses: actions/checkout@v4
        with:
          repository: thorwhalen/lacing
          ref: ${{ steps.lacing-version.outputs.version }}
          path: lacing-checkout
          sparse-checkout: lacing/schema

      - name: Codegen freshness
        env:
          LACING_SCHEMA_DIR: ${{ github.workspace }}/lacing-checkout/lacing/schema
        run: |
          npm run codegen
          if [ -n "$(git status --porcelain -- src/types/generated)" ]; then
            echo "::error::src/types/generated is stale for lacing ${{ steps.lacing-version.outputs.version }} (pinned in .lacing-version) — run 'npm run codegen' against that version's schemas and commit the result."
            git status -- src/types/generated
            git diff -- src/types/generated
            exit 1
          fi
